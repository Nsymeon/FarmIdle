<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="#0a0a0f"/>
  
  <!-- Glow effects -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Barn roof -->
  <polygon points="20,60 64,20 108,60" fill="none" stroke="#ff4444" stroke-width="3" filter="url(#glow2)"/>
  <polygon points="20,60 64,20 108,60" fill="none" stroke="#ff8888" stroke-width="1.5"/>

  <!-- Barn body -->
  <rect x="28" y="60" width="72" height="45" rx="2" fill="none" stroke="#ff4444" stroke-width="3" filter="url(#glow2)"/>
  <rect x="28" y="60" width="72" height="45" rx="2" fill="none" stroke="#ff8888" stroke-width="1.5"/>

  <!-- Barn door -->
  <rect x="50" y="80" width="28" height="25" rx="2" fill="none" stroke="#44ffaa" stroke-width="2.5" filter="url(#glow)"/>
  <rect x="50" y="80" width="28" height="25" rx="2" fill="none" stroke="#88ffcc" stroke-width="1"/>
  <line x1="64" y1="80" x2="64" y2="105" stroke="#44ffaa" stroke-width="1.5" filter="url(#glow)"/>

  <!-- Windows -->
  <rect x="34" y="68" width="14" height="14" rx="2" fill="none" stroke="#ffee44" stroke-width="2" filter="url(#glow)"/>
  <rect x="80" y="68" width="14" height="14" rx="2" fill="none" stroke="#ffee44" stroke-width="2" filter="url(#glow)"/>

  <!-- Chimney -->
  <rect x="76" y="30" width="10" height="22" fill="none" stroke="#ff4444" stroke-width="2.5" filter="url(#glow2)"/>

  <!-- Smoke puffs -->
  <circle cx="81" cy="26" r="4" fill="none" stroke="#aaaaff" stroke-width="1.5" filter="url(#glow)" opacity="0.8"/>
  <circle cx="84" cy="20" r="3" fill="none" stroke="#aaaaff" stroke-width="1.5" filter="url(#glow)" opacity="0.5"/>

  <!-- Ground line -->
  <line x1="15" y1="105" x2="113" y2="105" stroke="#44ffaa" stroke-width="2" filter="url(#glow)"/>

  <!-- Wheat left -->
  <line x1="16" y1="105" x2="16" y2="88" stroke="#ffee44" stroke-width="2" filter="url(#glow)"/>
  <ellipse cx="16" cy="85" rx="4" ry="6" fill="none" stroke="#ffee44" stroke-width="1.5" filter="url(#glow)"/>
  <line x1="22" y1="105" x2="22" y2="90" stroke="#ffee44" stroke-width="2" filter="url(#glow)"/>
  <ellipse cx="22" cy="87" rx="4" ry="6" fill="none" stroke="#ffee44" stroke-width="1.5" filter="url(#glow)"/>

  <!-- Wheat right -->
  <line x1="106" y1="105" x2="106" y2="88" stroke="#ffee44" stroke-width="2" filter="url(#glow)"/>
  <ellipse cx="106" cy="85" rx="4" ry="6" fill="none" stroke="#ffee44" stroke-width="1.5" filter="url(#glow)"/>
  <line x1="112" y1="105" x2="112" y2="90" stroke="#ffee44" stroke-width="2" filter="url(#glow)"/>
  <ellipse cx="112" cy="87" rx="4" ry="6" fill="none" stroke="#ffee44" stroke-width="1.5" filter="url(#glow)"/>

  <!-- Stars -->
  <circle cx="25" cy="15" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="45" cy="10" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="95" cy="12" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="110" cy="20" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="15" cy="35" r="1" fill="#ffffff" opacity="0.5"/>
</svg>