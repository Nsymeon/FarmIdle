name: Build Farm Idle APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Find Android SDK
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          ls $ANDROID_HOME/build-tools/
          JAVA_PATH=$(dirname $(dirname $(readlink -f $(which java))))
          echo "JAVA_PATH: $JAVA_PATH"
          echo "JAVA_HOME=$JAVA_PATH" >> $GITHUB_ENV

      - name: Install Build Tools
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Download Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot

      - name: Download Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Configure Godot Android paths
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls $JAVA_HOME/bin/
          ls $ANDROID_HOME/build-tools/
          mkdir -p ~/.config/godot
          echo '[gd_resource type="EditorSettings" format=3]' > ~/.config/godot/editor_settings-4.tres
          echo '[resource]' >> ~/.config/godot/editor_settings-4.tres
          echo "export/android/android_sdk_path = \"$ANDROID_HOME\"" >> ~/.config/godot/editor_settings-4.tres
          echo "export/android/java_sdk_path = \"$JAVA_HOME\"" >> ~/.config/godot/editor_settings-4.tres
          echo "=== Final file ==="
          cat ~/.config/godot/editor_settings-4.tres

      - name: Export APK
        run: |
          mkdir -p build/android
          godot --headless --export-release "Android" build/android/FarmIdle-unsigned.apk 2>&1 || true
          echo "=== Build dir ==="
          ls -la build/android/ || echo "empty"

      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore my-farm.keystore \
            -alias farm \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storetype PKCS12 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -dname "CN=FarmIdle, OU=Game, O=Game, L=Athens, ST=Attica, C=GR"

      - name: Sign APK
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks my-farm.keystore \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out build/android/FarmIdle.apk \
            build/android/FarmIdle-unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmIdle-APK-v${{ github.run_number }}
          path: build/android/FarmIdle.apk
          retention-days: 30