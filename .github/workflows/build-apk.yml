name: Build Farm Idle APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable

      - name: Setup Android paths
        run: |
          ln -sf /usr/lib/android-sdk/build-tools/33.0.2 /usr/lib/android-sdk/build-tools/34.0.0 || true
          timeout 30 godot --headless --quit 2>/dev/null || true
          echo "=== Settings file after first run ==="
          cat /root/.config/godot/editor_settings-4.3.tres || echo "File not found"
          echo "=== Appending Android settings ==="
          grep -q "android_sdk_path" /root/.config/godot/editor_settings-4.3.tres \
            && sed -i 's|export/android/android_sdk_path = .*|export/android/android_sdk_path = "/usr/lib/android-sdk"|' /root/.config/godot/editor_settings-4.3.tres \
            || echo 'export/android/android_sdk_path = "/usr/lib/android-sdk"' >> /root/.config/godot/editor_settings-4.3.tres
          grep -q "java_sdk_path" /root/.config/godot/editor_settings-4.3.tres \
            && sed -i 's|export/android/java_sdk_path = .*|export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"|' /root/.config/godot/editor_settings-4.3.tres \
            || echo 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' >> /root/.config/godot/editor_settings-4.3.tres
          echo "=== Final settings ==="
          cat /root/.config/godot/editor_settings-4.3.tres

      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore my-farm.keystore \
            -alias farm \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storetype PKCS12 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -dname "CN=FarmIdle, OU=Game, O=Game, L=Athens, ST=Attica, C=GR"

      - name: Export APK
        run: |
          mkdir -p build/android
          godot --headless --export-release "Android" build/android/FarmIdle-unsigned.apk
          echo "=== Build dir ==="
          ls -la build/android/

      - name: Sign APK
        run: |
          /usr/lib/android-sdk/build-tools/33.0.2/apksigner sign \
            --ks my-farm.keystore \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out build/android/FarmIdle.apk \
            build/android/FarmIdle-unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmIdle-APK-v${{ github.run_number }}
          path: build/android/FarmIdle.apk
          retention-days: 30