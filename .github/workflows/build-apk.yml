name: Build Farm Idle APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable

      - name: Setup Android paths
        run: |
          rm -f /root/.config/godot/editor_settings-4.3.tres
          echo "=== Checking Java ==="
          ls /usr/lib/jvm/ || echo "No JVM dir"
          ls /usr/lib/jvm/java-17-openjdk-amd64/ || echo "DIR NOT FOUND"
          ls /usr/lib/jvm/java-17-openjdk-amd64/bin/java || echo "NOT FOUND"
          JAVA_PATH=$(dirname $(dirname $(readlink -f $(which java))))
          echo "Java path: $JAVA_PATH"
          echo "=== Checking Android SDK ==="
          ls /usr/lib/android-sdk/build-tools/
          echo "=== Writing settings ==="
          mkdir -p /root/.config/godot
          echo '[gd_resource type="EditorSettings" format=3]' > /root/.config/godot/editor_settings-4.3.tres
          echo '[resource]' >> /root/.config/godot/editor_settings-4.3.tres
          echo "export/android/android_sdk_path = \"/usr/lib/android-sdk\"" >> /root/.config/godot/editor_settings-4.3.tres
          echo "export/android/java_sdk_path = \"$JAVA_PATH\"" >> /root/.config/godot/editor_settings-4.3.tres
          ln -sf /usr/lib/android-sdk/build-tools/33.0.2 /usr/lib/android-sdk/build-tools/34.0.0 || true
          echo "=== Final settings ==="
          cat /root/.config/godot/editor_settings-4.3.tres

      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore my-farm.keystore \
            -alias farm \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storetype PKCS12 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -dname "CN=FarmIdle, OU=Game, O=Game, L=Athens, ST=Attica, C=GR"

      - name: Export APK
        run: |
          mkdir -p build/android
          godot --headless --export-release "Android" build/android/FarmIdle-unsigned.apk
          echo "=== Build dir ==="
          ls -la build/android/

      - name: Sign APK
        run: |
          /usr/lib/android-sdk/build-tools/33.0.2/apksigner sign \
            --ks my-farm.keystore \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out build/android/FarmIdle.apk \
            build/android/FarmIdle-unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FarmIdle-APK-v${{ github.run_number }}
          path: build/android/FarmIdle.apk
          retention-days: 30